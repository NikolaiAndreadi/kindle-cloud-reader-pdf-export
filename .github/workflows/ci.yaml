name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck, lint and test
        run: npm run check

      - name: Committed bundles match src/
        run: |
          npm run build
          if ! git diff --exit-code -- background.js content.js popup.js preview.js; then
            echo "::error::Bundles are stale. Run 'npm run build' and commit the result."
            exit 1
          fi

      - name: vendor/tesseract is unmodified
        run: |
          npm run vendor
          if ! git diff --exit-code -- vendor/tesseract; then
            echo "::error::vendor/tesseract differs from the packaged upstream copy."
            exit 1
          fi

      - name: Release zip builds
        run: npm run pack
