<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Captured pages</title>
    <style>
      :root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; }
      body { margin: 0; }
      header {
        position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: baseline;
        flex-wrap: wrap; padding: 14px 20px; background: Canvas;
        border-bottom: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      }
      h1 { margin: 0; font-size: 16px; }
      .meta { opacity: .7; font-size: 13px; }
      .warn { color: #b3261e; font-weight: 600; }
      .lock {
        flex-basis: 100%; font-size: 13px; padding: 6px 9px; border-radius: 4px;
        background: color-mix(in srgb, #b3261e 12%, Canvas); color: #b3261e;
      }
      .lock[hidden] { display: none; }
      .ocr { flex-basis: 100%; display: flex; gap: 10px; align-items: center; font-size: 13px; }
      button {
        font: inherit; padding: 4px 10px; border-radius: 4px; cursor: pointer;
        color: inherit; background: Canvas;
        border: 1px solid color-mix(in srgb, CanvasText 35%, transparent);
      }
      button:disabled { opacity: .45; cursor: default; }
      button[hidden] { display: none; }
      #ocrStatus { opacity: .8; }
      /* Saving is what this page is for once the pages are in order, so it sits
         at the end of the header rather than in the flow of the grid: the header
         is sticky, so it stays reachable however far down the book you are. */
      .save {
        margin-left: auto; display: flex; gap: 10px; align-items: center; font-size: 13px;
        /* The header aligns its row on the h1's baseline, which a box of
           controls does not have a sensible one of. */
        align-self: center;
      }
      .save select { font: inherit; padding: 3px 4px; }
      .save label { display: flex; gap: 6px; align-items: center; opacity: .8; }
      #save { font-weight: 600; }
      #saveStatus { opacity: .8; }
      /* The one irreversible thing on the page, so it is kept away from Save and
         held rather than clicked — the bar fills over --hold-ms as it is held,
         and letting go early is the cancel. */
      #clear {
        margin-left: auto; user-select: none; color: #b3261e; border-color: #b3261e;
        background-image: linear-gradient(#b3261e33, #b3261e33);
        background-repeat: no-repeat; background-size: 0 100%;
      }
      #clear.holding { background-size: 100% 100%; transition: background-size var(--hold-ms, 2000ms) linear; }
      /* Marks the pages that already carry a text layer, so a part-finished run
         is visible on the grid rather than only in the counter. */
      figcaption .text { flex: none; opacity: .75; }
      main { padding: 20px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
      figure { margin: 0; cursor: grab; }
      figure.dragging { opacity: .4; cursor: grabbing; }
      .locked figure { cursor: default; }
      /* No cursor of its own: it inherits the figure's grab, since dragging is
         what the pointer does here far more often than opening the close-up. */
      figure img {
        display: block; width: 100%; height: auto; border-radius: 4px;
        background: #fff; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
      }
      figure.gone {
        min-height: 60px; border-radius: 4px;
        border: 1px dashed color-mix(in srgb, CanvasText 35%, transparent);
      }
      figcaption { margin-top: 5px; font-size: 12px; opacity: .8; display: flex; align-items: center; gap: 6px; }
      figcaption span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .del {
        flex: none; padding: 0 5px; font: inherit; line-height: 1.4; color: inherit; cursor: pointer;
        background: none; border: 1px solid transparent; border-radius: 4px; opacity: .55;
      }
      .del:hover, .del:focus-visible { opacity: 1; border-color: color-mix(in srgb, CanvasText 30%, transparent); }
      .del.armed { opacity: 1; color: #b3261e; font-weight: 600; border-color: #b3261e; }
      .del:disabled { opacity: .3; cursor: default; }
      .dupe img { outline: 2px solid #b3261e; outline-offset: 1px; }
      .dupe figcaption { color: #b3261e; }
      dialog { padding: 0; border: 0; max-width: 96vw; max-height: 96vh; background: transparent; }
      dialog::backdrop { background: #000c; }
      dialog img { max-width: 96vw; max-height: 92vh; display: block; cursor: zoom-out; }
      dialog form { text-align: center; margin-top: 8px; }
      .empty { padding: 40px 20px; opacity: .7; }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Captured pages</h1>
      <span class="meta" id="summary">Loading…</span>
      <div class="save">
        <span id="saveStatus"></span>
        <label>
          Page size
          <select id="paper">
            <option value="a4" selected>A4</option>
            <option value="letter">US Letter</option>
            <option value="native">Match capture</option>
          </select>
        </label>
        <button id="save" type="button">Save PDF</button>
        <button id="saveText" type="button">Save text PDF</button>
      </div>
      <span class="lock" id="lock" hidden></span>
      <div class="ocr">
        <button id="ocrStart" type="button">Add searchable text (OCR)</button>
        <button id="ocrStop" type="button" hidden>Stop</button>
        <span id="ocrStatus"></span>
        <button id="clear" type="button">Hold to clear the book</button>
      </div>
    </header>
    <main id="grid"></main>
    <dialog id="viewer">
      <img id="viewer-image" alt="">
      <form method="dialog"><button>Close</button></form>
    </dialog>
    <!-- Before preview.js and not part of the bundle: it publishes the global
         the OCR module reaches for, and vendored code is easier to trust when it
         is still recognisably the file that was vendored. -->
    <script src="vendor/tesseract/tesseract.min.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
